[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "grammar-correction-claim-audit"
version = "0.1.0"
description = "Offline static documentation claim auditor for sentence repair capabilities"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
grammar-correction-claim-audit = "grammar_correction_claim_audit.audit:main"

[tool.setuptools.packages.find]
include = ["grammar_correction_claim_audit*"]
